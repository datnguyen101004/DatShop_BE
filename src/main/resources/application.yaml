spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
#  data:
#    redis:
#      host: localhost
#      port: 6379
#  session:
#    store-type: redis
  main:
    allow-circular-references: true
